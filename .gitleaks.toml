# Gitleaks configuration
#
# [extend] is NOT optional. A custom config REPLACES the built-in ruleset rather
# than adding to it, so this file without useDefault left gitleaks running with
# zero rules — scanning everything, matching nothing, and reporting "no leaks
# found" on a planted GitHub PAT both locally and in CI. Never add an allowlist
# here without this block.
[extend]
  useDefault = true

[allowlist]
  description = "Allowlist for false positives"
  paths = [
    # safe-gh-pr contains detection patterns (not real secrets)
    '''scripts/safe-gh-pr''',
  ]
