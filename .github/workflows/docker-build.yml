name: Docker Build

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/compose*.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/compose*.yml"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_BACKEND: mlorentedev/pdf-modifier-api
  IMAGE_FRONTEND: mlorentedev/pdf-modifier-web

jobs:
  build-backend:
    name: Backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)
            MAJOR=${VERSION%%.*}
            MINOR=${VERSION%.*}
            # Partial semver (1.8, 1) plus the commit SHA for traceability, as
            # GHCR already does. Multiline via the EOF-delimited form because a
            # repeated single-line key would overwrite, not append. The empty
            # expansion on non-tag pushes is inert: build-push-action skips
            # empty lines in the tags list.
            echo "version=$VERSION"
            echo "extra_tags<<EOF" >> $GITHUB_OUTPUT
            echo "${MINOR}" >> $GITHUB_OUTPUT
            echo "${MAJOR}" >> $GITHUB_OUTPUT
            echo "sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "version=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.version.outputs.extra_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify health (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name test-api -p 8000:8000 ${{ env.IMAGE_BACKEND }}:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api && docker rm test-api

  build-frontend:
    name: Frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=$(grep -m1 '^version' backend/pyproject.toml | cut -d'"' -f2)
            MAJOR=${VERSION%%.*}
            MINOR=${VERSION%.*}
            # Partial semver (1.8, 1) plus the commit SHA for traceability, as
            # GHCR already does. Multiline via the EOF-delimited form because a
            # repeated single-line key would overwrite, not append. The empty
            # expansion on non-tag pushes is inert: build-push-action skips
            # empty lines in the tags list.
            echo "version=$VERSION"
            echo "extra_tags<<EOF" >> $GITHUB_OUTPUT
            echo "${MINOR}" >> $GITHUB_OUTPUT
            echo "${MAJOR}" >> $GITHUB_OUTPUT
            echo "sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "version=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.version.outputs.extra_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists (PR only)
        if: github.event_name == 'pull_request'
        run: |
          docker image inspect ${{ env.IMAGE_FRONTEND }}:latest || exit 1
          echo "Frontend image built successfully"

  compose:
    name: Docker Compose up
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create .env
        run: cp .env.example infra/.env

      - name: Compose up
        run: docker compose -f infra/compose.base.yml up -d --build

      - name: Wait for services
        run: |
          sleep 15
          docker compose -f infra/compose.base.yml ps

      - name: Check health
        run: |
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8080/health || exit 1

      - name: Compose down
        if: always()
        run: docker compose -f infra/compose.base.yml down -v
